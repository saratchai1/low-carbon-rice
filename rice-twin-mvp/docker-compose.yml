services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rice_twin
      POSTGRES_USER: rice_twin
      POSTGRES_PASSWORD: rice_twin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rice_twin -d rice_twin"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://rice_twin:rice_twin@db:5432/rice_twin
      IMAGERY_DIR: /data/imagery
      SATELLITE_OUTPUT_DIR: /satellite-output
      MAX_UPLOAD_MB: 512
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data/imagery:/data/imagery
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests:ro
      - ../output:/satellite-output:ro
    restart: unless-stopped

volumes:
  postgres_data:
